<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · Dicionário</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
*{-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#111827}
a{color:#2747D6}a:hover{color:#1C35A8}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #2747D6;outline-offset:2px}
input::placeholder{color:#6B7280}
.phone{width:390px;height:844px;border-radius:32px;overflow:hidden;box-shadow:0 1px 2px rgba(17,24,39,.08),0 24px 64px rgba(17,24,39,.16);flex:none;background:#F4F5F7}

body{min-height:100vh;background:#DDE1E8;display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 16px 40px;box-sizing:border-box}
.top{width:390px;max-width:100%;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;color:#374151}
.top a{text-decoration:none;font-weight:700}
@media (max-width:430px){body{padding:0;background:#F4F5F7}.top{display:none}.phone{border-radius:0;box-shadow:none}}
@media (max-width:389px){.phone{zoom:.92}}
</style>
</head>
<body>
<div class="top"><a href="index.html">← Todas as telas</a><span>01 · Login</span></div>
<main class="phone">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 34px; background: #F4F5F7; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #111827; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="display: flex; flex-direction: column; gap: 20px">
    <div style="width: 56px; height: 56px; border-radius: 16px; background: #2747D6; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 34px; line-height: 40px; font-weight: 800; letter-spacing: -0.02em">Dicionário</h1>
      <p style="margin: 0; font-size: 16px; line-height: 24px; color: #4B5563">Aprenda inglês <span style="box-shadow: inset 0 -9px 0 #FFE066; color: #111827; font-weight: 600">palavra por palavra</span>. Seus favoritos e histórico ficam salvos na sua conta.</p>
    </div>
  </div>

  <div aria-hidden="true" style="margin: 32px 8px 0; background: #FFFFFF; border-radius: 20px; padding: 20px; box-shadow: 0 1px 2px rgba(17, 24, 39, 0.06), 0 12px 32px rgba(17, 24, 39, 0.08); display: flex; flex-direction: column; gap: 6px; transform: rotate(-2deg)">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <span style="font-size: 28px; line-height: 34px; font-weight: 800; letter-spacing: -0.02em; box-shadow: inset 0 -10px 0 #FFE066">hello</span>
      <span style="height: 28px; padding: 0 12px; border-radius: 999px; background: #E8ECFC; color: #1C35A8; font-size: 13px; font-weight: 700; display: flex; align-items: center">interjection</span>
    </div>
    <span style="font-family: 'Noto Sans', 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #4B5563">/həˈləʊ/</span>
    <span style="font-size: 14px; line-height: 20px; color: #4B5563">A greeting (salutation) said when meeting someone…</span>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="email" style="font-size: 14px; font-weight: 600; color: #111827">E-mail</label>
      <div style="position: relative">
        <svg aria-hidden="true" style="position: absolute; left: 16px; top: 16px" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
        <input id="email" type="email" autocomplete="email" placeholder="voce@email.com" style="width: 100%; box-sizing: border-box; height: 52px; padding: 0 16px 0 46px; border: 1px solid #D1D5DB; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #111827">
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="senha" style="font-size: 14px; font-weight: 600; color: #111827">Senha</label>
      <div style="position: relative">
        <svg aria-hidden="true" style="position: absolute; left: 16px; top: 16px" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        <input id="senha" type="password" autocomplete="current-password" placeholder="Mínimo de 6 caracteres" style="width: 100%; box-sizing: border-box; height: 52px; padding: 0 52px 0 46px; border: 1px solid #D1D5DB; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #111827">
        <button type="button" aria-label="Mostrar senha" style="position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
      <div style="display: flex; justify-content: flex-end">
        <button type="button" style="height: 36px; padding: 0; border: 0; background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; color: #2747D6; cursor: pointer">Esqueci minha senha</button>
      </div>
    </div>

    <a href="lista.html" style="height: 52px; border-radius: 14px; background: #2747D6; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Entrar</a>

    <p style="margin: 0; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 14px; color: #4B5563">Não tem conta?
      <a href="cadastro.html" style="height: 44px; padding: 0 4px; display: flex; align-items: center; font-size: 14px; font-weight: 700; color: #2747D6; text-decoration: none">Criar conta</a>
    </p>
  </div>
</div>
</main>
</body>
</html>
